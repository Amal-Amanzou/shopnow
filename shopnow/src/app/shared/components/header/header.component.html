<!-- src/app/shared/components/header/header.component.html -->
<header class="header">
  <div class="header-inner">

    <!-- Logo -->
    <a routerLink="/produits" class="logo">
      <span class="logo-icon">S</span>
      <span class="logo-text">ShopNow</span>
    </a>

    <!-- Barre de recherche (décorative pour l'instant) -->
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Rechercher un produit..." class="search-input" [(ngModel)]="searchTerm" (keyup.enter)="onSearch()" />
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <!-- Badge favoris -->
      <a routerLink="/favoris" class="fav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        Favoris
        @if (favoriteCount > 0) {
          <span class="cart-badge">{{ favoriteCount }}</span>
        }
      </a>

      <a routerLink="/mon-compte" class="nav-link">Mon compte</a>

      <!-- Badge panier -->
      <a routerLink="/panier" class="cart-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Panier
        @if (cartCount > 0) {
          <span class="cart-badge">{{ cartCount }}</span>
        }
      </a>
    </nav>

  </div>
</header>
